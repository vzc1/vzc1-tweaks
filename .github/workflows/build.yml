name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vzc1-optimizations.exe
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sma = [System.Management.Automation.PSObject].Assembly.Location
          $ver = "2.0.${{ github.run_number }}.0"
          (Get-Content build\Launcher.cs -Raw) -replace '\[assembly: AssemblyCompany', "[assembly: AssemblyVersion(`"$ver`")]`n[assembly: AssemblyFileVersion(`"$ver`")]`n[assembly: AssemblyCompany" | Set-Content build\Launcher.gen.cs
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu `
            /out:vzc1-optimizations.exe `
            /win32manifest:build\app.manifest `
            /win32icon:build\icon.ico `
            "/resource:vzc1-optimizations.ps1,app.ps1" `
            "/reference:$sma" /reference:System.Windows.Forms.dll `
            build\Launcher.gen.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path vzc1-optimizations.exe)) { throw 'Build failed' }

      - name: Package script version
        shell: powershell
        run: Compress-Archive -Path vzc1-optimizations.ps1, Run-vzc1-optimizations.bat, README.md -DestinationPath vzc1-optimizations-script.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vzc1-optimizations
          path: |
            vzc1-optimizations.exe
            vzc1-optimizations-script.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: vzc1's optimizations v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **vzc1-optimizations.exe** below and run it.

            If Windows SmartScreen shows "Windows protected your PC", click **More info** then **Run anyway**. That shows up for any new app that isn't code-signed.

            Prefer not to run an exe? Download **vzc1-optimizations-script.zip**, unzip it, and double-click `Run-vzc1-optimizations.bat`. Same app, and you can read every line of it.
          files: |
            vzc1-optimizations.exe
            vzc1-optimizations-script.zip
