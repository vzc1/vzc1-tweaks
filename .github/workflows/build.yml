name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the app loads on Windows
        shell: powershell
        run: |
          $src = Get-Content vzc1-optimizations.ps1 -Raw
          # Syntax
          $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$null, [ref]$errs)
          if ($errs.Count) { $errs | ForEach-Object { Write-Host $_ }; throw 'Script has syntax errors' }
          # Native Windows code compiles and runs
          $m = [regex]::Match($src, "-MemberDefinition @'\r?\n(.*?)\r?\n'@", 'Singleline')
          Add-Type -Namespace Vz -Name Native -MemberDefinition $m.Groups[1].Value
          [void][Vz.Native]::CpuPercent(); Start-Sleep -Milliseconds 300
          Write-Host "CPU now: $([Vz.Native]::CpuPercent())%"
          # Window layout loads in WPF
          Add-Type -AssemblyName PresentationFramework
          $x = [regex]::Match($src, "\[xml\]\`$xaml = @'\r?\n(.*?)\r?\n'@", 'Singleline')
          [xml]$xml = $x.Groups[1].Value
          $win = [Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $xml))
          foreach ($k in 'Switch','Check','Btn','Primary','Seg','Nav','ChromeBtn') { [void]$win.FindResource($k) }
          Write-Host 'Window layout OK'

      - name: Test every tweak on a throwaway Windows machine
        shell: powershell
        continue-on-error: true
        run: |
          $src = Get-Content vzc1-optimizations.ps1 -Raw
          $code = $src.Substring(0, $src.IndexOf('# ---------- Fortnite settings file ----------'))
          Invoke-Expression $code
          $rows = @('| Tweak | On works | Off works |', '|---|---|---|')
          foreach ($t in $Tweaks) {
            $avail = $true; if ($t.Available) { $avail = [bool](& $t.Available) }
            if (-not $avail) { $rows += "| $($t.Name) | not available here | |"; continue }
            $onOk = $false; $offOk = $false; $err = ''
            try { & $t.On; $onOk = [bool](& $t.Get) } catch { $err = $_.Exception.Message }
            try { & $t.Off; $offOk = -not [bool](& $t.Get) } catch { if (-not $err) { $err = $_.Exception.Message } }
            $rows += "| $($t.Name) | $(if ($onOk) { 'yes' } else { 'NO ' + $err }) | $(if ($offOk) { 'yes' } else { 'NO' }) |"
          }
          $rows -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $rows | ForEach-Object { Write-Host $_ }

      - name: Build vzc1-optimizations.exe
        shell: powershell
        run: |
          $ps1 = (Get-Content vzc1-optimizations.ps1 -Raw) -replace "\`$APP_VERSION\s+= '[^']*'", "`$APP_VERSION   = '5.0.${{ github.run_number }}'"
          [IO.File]::WriteAllText("$PWD\vzc1-optimizations.ps1", $ps1)
          Select-String -Path vzc1-optimizations.ps1 -Pattern '^\$APP_VERSION'
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sma = [System.Management.Automation.PSObject].Assembly.Location
          $ver = "5.0.${{ github.run_number }}.0"
          (Get-Content build\Launcher.cs -Raw) -replace '\[assembly: AssemblyCompany', "[assembly: AssemblyVersion(`"$ver`")]`n[assembly: AssemblyFileVersion(`"$ver`")]`n[assembly: AssemblyCompany" | Set-Content build\Launcher.gen.cs
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu `
            /out:vzc1-optimizations.exe `
            /win32manifest:build\app.manifest `
            /win32icon:build\icon.ico `
            "/resource:vzc1-optimizations.ps1,app.ps1" `
            "/reference:$sma" /reference:System.Windows.Forms.dll `
            build\Launcher.gen.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path vzc1-optimizations.exe)) { throw 'Build failed' }

      - name: Package script version
        shell: powershell
        run: Compress-Archive -Path vzc1-optimizations.ps1, Run-vzc1-optimizations.bat, README.md -DestinationPath vzc1-optimizations-script.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vzc1-optimizations
          path: |
            vzc1-optimizations.exe
            vzc1-optimizations-script.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: vzc1's optimizations v5.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **vzc1-optimizations.exe** below and run it.

            If Windows SmartScreen shows "Windows protected your PC", click **More info** then **Run anyway**. That shows up for any new app that isn't code-signed.

            Prefer not to run an exe? Download **vzc1-optimizations-script.zip**, unzip it, and double-click `Run-vzc1-optimizations.bat`. Same app, and you can read every line of it.
          files: |
            vzc1-optimizations.exe
            vzc1-optimizations-script.zip
