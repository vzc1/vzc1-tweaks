name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build FPSBoost.exe
        shell: powershell
        run: |
          Invoke-ps2exe -inputFile FPSBoost.ps1 -outputFile FPSBoost.exe `
            -noConsole -requireAdmin -STA `
            -title 'FPS Boost' -product 'FPS Boost' -description 'Windows tweaks for Fortnite that actually do something' `
            -version "2.0.${{ github.run_number }}.0"
          if (-not (Test-Path FPSBoost.exe)) { throw 'Build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: FPSBoost
          path: FPSBoost.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: FPS Boost v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download **FPSBoost.exe** below and run it. Windows may warn because the exe isn't code-signed. Click "More info" then "Run anyway".
          files: FPSBoost.exe
